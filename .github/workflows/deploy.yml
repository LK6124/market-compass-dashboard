name: 每日更新并发布看板

on:
  schedule:
    # GitHub Actions 使用 UTC；12:30 UTC = 北京时间 20:30
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-dashboard-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取最新市场数据
        run: npm run update

      - name: 提交数据快照
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "market-dashboard-bot@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交。"
          else
            git commit -m "chore: 更新市场数据快照"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包静态网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
